<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Erin's 40th — Copenhagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="sky-hero">
    <div class="oculus" aria-hidden="true"></div>
    <div class="sky-hero-copy">
      <h1>Forty<br />in the<br />Light</h1>
      <p class="subtitle">Plenty of light left</p>
    </div>
  </header>

  <main>

    <section class="moment moment-where">
      <p class="place">Copenhagen</p>
      <p class="when">July 2027</p>
    </section>

    <section class="moment moment-list" aria-label="Long days, good food, changing art, forever friends">
      <p class="list-item">Long days.</p>
      <p class="list-item">Good food.</p>
      <p class="list-item">Changing art.</p>
      <p class="list-item">Forever friends.</p>
    </section>

    <section class="moment moment-art">
      <p class="section-line">
        A journey to Aarhus, to stand inside
        <span class="emphasis">Skydome</span> by James Turrell.
      </p>
      <p class="section-line">Come celebrate my 40th in the light.<br /><br />💙 Erin</p>
    </section>

    <section class="moment moment-essentials">
      <p class="detail-word">Details to come.</p>
    </section>

  </main>

</body>
</html>
